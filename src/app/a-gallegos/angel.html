<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        -45deg,
        #0f172a,
        #312e81,
        #7c3aed,
        #0f766e
      );

      background-size: 400% 400%;
      animation: fondo 12s ease infinite;
    }

    h1 {
      width: 100%;
      padding: 0 20px;

      text-align: center;

      font-size: clamp(2.5rem, 8vw, 8rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 3px;

      color: transparent;

      background: linear-gradient(
        90deg,
        #67e8f9,
        #a78bfa,
        #f0abfc,
        #67e8f9
      );

      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;

      animation:
        texto 4s linear infinite,
        flotando 3s ease-in-out infinite;

      filter: drop-shadow(0 0 15px #a78bfa);
    }

    @keyframes fondo {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes texto {
      to {
        background-position: 300% center;
      }
    }

    @keyframes flotando {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }
  </style>
</head>

<body>

  <h1>Angel gallegos nava.</h1>

</body>
</html>
